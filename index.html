<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean 티어표 내전 밸런서 (명단 편집 가능)</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --primary-hover: #0ea5e9; --red-team: #ef4444; --blue-team: #3b82f6; --border: #334155; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .controls { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        button, select, input[type="text"] { background-color: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        input[type="text"] { background-color: #0f172a; color: #fff; border: 1px solid var(--border); font-weight: normal; cursor: text; }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: #475569; color: #fff; }
        button.secondary:hover { background-color: #334155; }
        .tier-group { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tier-title { font-weight: bold; color: var(--primary); margin-bottom: 8px; }
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .player-card { background: #151f32; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); }
        .player-info { display: flex; align-items: center; gap: 8px; flex-grow: 1; min-width: 0; }
        .player-info span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .player-card select { padding: 2px 4px; font-size: 12px; background: #0f172a; color: #fff; border: 1px solid var(--border); margin-right: 5px; }
        .btn-delete { background: none; color: #ef4444; border: none; padding: 0 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-delete:hover { color: #f87171; }
        .team-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
        .team-card { background: #151f32; border: 2px solid var(--border); border-radius: 8px; padding: 15px; }
        .team-card.Blue { border-color: var(--blue-team); }
        .team-card.Red { border-color: var(--red-team); }
        .team-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .team-header.Blue { color: var(--primary); }
        .team-header.Red { color: var(--red-team); }
        .team-avg { font-size: 12px; color: var(--text-muted); }
        .member-list { list-style: none; padding: 0; margin: 0; }
        .member-item { padding: 6px 0; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; }
        .captain { color: #f59e0b; font-weight: bold; }
        .bracket-container { margin-top: 20px; padding: 15px; background: #151f32; border-radius: 8px; }
        .match-row { display: flex; justify-content: space-between; background: var(--card-bg); padding: 10px; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Korean 티어표 내전 밸런서</h1>
        <div class="section">
            <h2>📢 1. 출석 체크 및 티어 선택</h2>
            <div class="controls">
                <button onclick="toggleAll(true)">전체 선택</button>
                <button onclick="toggleAll(false)" class="secondary">전체 해제</button>
                <select id="modeSelect" onchange="saveToLocalStorage()">
                    <option value="4">4v4 모드</option>
                    <option value="5">5v5 모드</option>
                </select>
                <button onclick="resetRosterData()" class="secondary" style="background-color: #f43f5e; color: #fff;">기본 명단으로 초기화</button>
                <span id="attendanceCount" style="margin-left:auto; align-self:center; font-weight:bold;">출석 인원: 0명</span>
            </div>
            <div id="rosterContainer"></div>
        </div>
        <div class="section">
            <h2>✍️ 2. 참가자 명단 직접 관리 (추가/삭제)</h2>
            <div class="controls">
                <input type="text" id="newPlayerName" placeholder="새 플레이어 이름 입력" onkeyup="if(window.event.keyCode==13){addCustomPlayer()}">
                <select id="newPlayerTier"></select>
                <button onclick="addCustomPlayer()">+ 명단에 추가</button>
            </div>
        </div>
        <div class="section" style="text-align: center;">
            <button onclick="generateTeamsAndBrackets()" style="font-size: 18px; padding: 15px 40px; width: 100%;">🔄 균형 팀 및 대진 생성 (리롤)</button>
        </div>
        <div class="section" id="resultSection" style="display:none;">
            <h2>⚔️ 3. 균형 매칭 결과 (A팀부터 출력)</h2>
            <div id="teamsOutput" class="team-container"></div>
            <div id="subOutput" style="margin-top: 20px; padding: 15px; background: #151f32; border-radius: 8px; color: #f59e0b; font-weight: bold; display: none;"></div>
        </div>
        <div class="section" id="bracketSection" style="display:none;">
            <h2>🏆 4. 내전 대진표 (토너먼트 식)</h2>
            <div id="bracketOutput" class="bracket-container"></div>
        </div>
    </div>
    <script>
        const initialRoster = {
            "1티어": ["zxczxc1", "Grrrr", "InfiNoise", "Firelose"],
            "2티어": ["Yaho", "DDDDFFFF", "zizonkalshot", "Sugarcandy", "thirsty", "Xeon"],
            "3티어": ["m1m2m3", "Hangjun", "SeoSooGyo", "iksuking", "1hodang", "Morglay"],
            "4티어": ["E1T1", "Auto777", "Racer072", "EEND", "Sacheon", "ParkSoRyong", "chunb0ng", "Oska"],
            "5티어": ["Attack", "Selna0", "MaChoNam", "Clover", "SONATA", "milli", "dltkdals", "sohuqwe"],
            "6티어": ["Condom", "Junyy", "PirateKing", "badboydoo", "Lucius", "koreagot", "LeeHyeonMin"],
            "7티어": ["Arden", "Ulysses", "Orora", "Goodbyee", "Shop"],
            "8티어": ["BLUE", "dicaprio", "sgtkeroro"],
            "9티어": ["Giroro", "TossBank", "Jaepal"],
            "10티어": ["ShinRyuJin", "Jihun"],
            "추가명단": ["Career", "Lxn4ticKR", "Pocari1", "Pixel", "Daily"]
        };
        const tierWeights = { "1티어": 10, "2티어": 9, "3티어": 8, "4티어": 7, "5티어": 6, "6티어": 5, "7티어": 4, "8티어": 3, "9티어": 2, "10티어": 1, "추가명단": 4.5 };
        let players = [];

        function init() {
            const newPlayerTierSelect = document.getElementById('newPlayerTier');
            Object.keys(initialRoster).forEach(tier => {
                const opt = document.createElement('option');
                opt.value = tier; opt.innerText = tier;
                newPlayerTierSelect.appendChild(opt);
            });
            try {
                const saved = localStorage.getItem('custom_match_final_roster');
                if (saved) players = JSON.parse(saved);
            } catch (e) { console.error(e); }
            if (!Array.isArray(players) || players.length === 0 || !players) {
                buildDefaultRoster();
            }
            renderRoster();
            const sm = localStorage.getItem('custom_match_final_mode');
            if (sm) document.getElementById('modeSelect').value = sm;
        }

        function buildDefaultRoster() {
            players = []; let id = 1;
            for (const [tier, names] of Object.entries(initialRoster)) {
                names.forEach(n => { players.push({ id: id++, name: n, tier: tier, checked: false }); });
            }
            saveToLocalStorage();
        }

        function resetRosterData() { 
            if(confirm("기본 명단으로 초기화하시겠습니까? (새로 추가한 유저는 삭제됩니다)")) {
                buildDefaultRoster(); renderRoster(); 
                document.getElementById('resultSection').style.display = 'none'; 
                document.getElementById('bracketSection').style.display = 'none'; 
            }
        }
        function updateAttendanceCount() {
            const count = players.filter(p => p.checked).length;
            document.getElementById('attendanceCount').innerText = `출석 인원: ${count}명`;
        }
        function toggleAll(status) {
            players.forEach(p => p.checked = status); saveToLocalStorage(); renderRoster();
        }
        function changePlayerTier(playerId, newTier) {
            const player = players.find(p => p.id === playerId);
            if (player) { player.tier = newTier; saveToLocalStorage(); renderRoster(); }
        }
        function addCustomPlayer() {
            const nameInput = document.getElementById('newPlayerName');
            const tierSelect = document.getElementById('newPlayerTier');
            const name = nameInput.value.trim(); const tier = tierSelect.value;
            if(!name) { alert("이름을 입력해주세요!"); return; }
            if(players.some(p => p.name === name)) { alert("이미 명단에 존재하는 이름입니다."); return; }
            const nextId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
            players.push({ id: nextId, name: name, tier: tier, checked: true });
            saveToLocalStorage(); renderRoster(); nameInput.value = ''; nameInput.focus();
        }

        function deletePlayer(playerId) {
            players = players.filter(p => p.id !== playerId); saveToLocalStorage(); renderRoster();
        }

        function renderRoster() {
            const container = document.getElementById('rosterContainer'); container.innerHTML = '';
            const T = Object.keys(initialRoster);
            T.forEach(tier => {
                const GP = players.filter(p => p.tier === tier); if(GP.length === 0) return;
                const gDiv = document.createElement('div'); gDiv.className = 'tier-group';
                const title = document.createElement('div'); title.className = 'tier-title'; title.innerText = tier;
                gDiv.appendChild(title);
                const grid = document.createElement('div'); grid.className = 'player-grid';
                GP.forEach(p => {
                    const card = document.createElement('div'); card.className = 'player-card';
                    const info = document.createElement('div'); info.className = 'player-info';
                    const chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = p.checked;
                    chk.addEventListener('change', () => { p.checked = chk.checked; saveToLocalStorage(); updateAttendanceCount(); });
                    const nameSpan = document.createElement('span'); nameSpan.innerText = p.name; nameSpan.title = p.name;
                    info.appendChild(chk); info.appendChild(nameSpan); card.appendChild(info);
                    const sel = document.createElement('select');
                    T.forEach(t => {
                        const opt = document.createElement('option'); opt.value = t; opt.innerText = t;
                        if(p.tier === t) opt.selected = true; sel.appendChild(opt);
                    });
                    sel.addEventListener('change', (e) => { changePlayerTier(p.id, e.target.value); });
                    card.appendChild(sel);
                    const delBtn = document.createElement('button'); delBtn.className = 'btn-delete'; delBtn.innerHTML = '❌'; delBtn.title = '명단에서 삭제';
                    delBtn.onclick = () => deletePlayer(p.id); card.appendChild(delBtn); grid.appendChild(card);
                });
                gDiv.appendChild(grid); container.appendChild(gDiv);
            });
            updateAttendanceCount();
        }
        function generateTeamsAndBrackets() {
            const playingPlayers = players.filter(p => p.checked);
            const size = parseInt(document.getElementById('modeSelect').value, 10); const needed = size * 2;
            if (playingPlayers.length < needed) { alert(`최소 ${needed}명이 출석 체크되어야 합니다! (현재: ${playingPlayers.length}명)`); return; }
            let totalTeams = Math.floor(playingPlayers.length / size);
            if (totalTeams % 2 !== 0 && totalTeams > 1) { totalTeams -= 1; }
            if (totalTeams < 2) totalTeams = 2;
            const maxPlayingCount = totalTeams * size; playingPlayers.sort(() => Math.random() - 0.5);
            const activePlayers = playingPlayers.slice(0, maxPlayingCount); const subPlayers = playingPlayers.slice(maxPlayingCount);
            const caps = activePlayers.filter(p => p.tier === "1티어" || p.tier === "2티어").sort(() => Math.random() - 0.5);
            const commons = activePlayers.filter(p => p.tier !== "1티어" && p.tier !== "2티어").sort(() => Math.random() - 0.5);
            let cTeams = Array.from({ length: totalTeams }, (_, i) => ({ id: i + 1, name: String.fromCharCode(65 + i) + '팀', members: [], scoreSum: 0, side: '' }));
            let capIdx = 0;
            while(capIdx < caps.length && capIdx < totalTeams) {
                cTeams[capIdx].members.push(caps[capIdx]); cTeams[capIdx].scoreSum += tierWeights[caps[capIdx].tier]; capIdx++;
            }
            let remainPool = [...caps.slice(capIdx), ...commons].sort((a, b) => tierWeights[b.tier] - tierWeights[a.tier]);
            remainPool.forEach(p => {
                cTeams.sort((a, b) => a.members.length - b.members.length || a.scoreSum - b.scoreSum);
                cTeams[0].members.push(p); cTeams[0].scoreSum += tierWeights[p.tier];
            });
            const sides = ['Blue', 'Red']; cTeams.forEach(t => { t.side = sides[Math.floor(Math.random() * sides.length)]; });
            cTeams.sort((a, b) => a.id - b.id); renderResults(cTeams, size, subPlayers);
        }
        
        function renderResults(teams, size, subs) {
            document.getElementById('resultSection').style.display = 'block'; document.getElementById('bracketSection').style.display = 'block';
            const out = document.getElementById('teamsOutput'); out.innerHTML = '';
            teams.forEach(t => {
                const avg = (t.scoreSum / size).toFixed(1);
                const card = document.createElement('div'); card.className = `team-card ${t.side}`;
                const header = document.createElement('div'); header.className = `team-header ${t.side}`;
                header.innerHTML = `<span>${t.name} (${t.side==='Blue'?'블루':'레드'})</span><span class="team-avg">평균: ${avg}점</span>`;
                card.appendChild(header); const ul = document.createElement('ul'); ul.className = 'member-list';
                t.members.sort((a,b) => (b.tier==='1티어'||b.tier==='2티어') - (a.tier==='1티어'||a.tier==='2티어'));
                t.members.forEach((m, idx) => {
                    const li = document.createElement('li'); li.className = 'member-item';
                    const isCap = (idx === 0 && (m.tier === '1티어' || m.tier === '2티어'));
                    li.innerHTML = `<span class="${isCap?'captain':''}">${isCap?'👑 ':''}${m.name}</span><span style="font-size:11px;color:var(--text-muted);">${m.tier.replace('명단','')}</span>`;
                    ul.appendChild(li);
                });
                card.appendChild(ul); out.appendChild(card);
            });
            const subBox = document.getElementById('subOutput');
            if(subs.length > 0) { subBox.style.display = 'block'; subBox.innerText = `⏳ 이번 턴 대기 멤버 (${subs.length}명): ` + subs.map(s => s.name).join(', '); } else { subBox.style.display = 'none'; }
            renderBrackets(teams);
        }

        function renderBrackets(teams) {
            const out = document.getElementById('bracketOutput'); out.innerHTML = ''; if (!teams || teams.length < 2) return;
            let tournamentTeams = [...teams].sort(() => Math.random() - 0.5); let total = tournamentTeams.length;
            out.innerHTML = `<p style="color:var(--primary);font-weight:bold;margin-bottom:10px;">📊 토너먼트 매칭: [${total}강 대항전]</p>`;
            if (total === 2) {
                out.innerHTML += `<div class="match-row" style="border-color:#eab308;"><span>[🏆 결승전]</span> <strong>${tournamentTeams[0].name} (${tournamentTeams[0].side}) &nbsp;<b>VS</b>&nbsp; ${tournamentTeams[1].name} (${tournamentTeams[1].side})</strong></div>`; return;
            }
            let roundLabel = total <= 4 ? "4강" : total <= 8 ? "8강" : "본선 토너먼트";
            let nextPowerOfTwo = Math.pow(2, Math.ceil(Math.log2(total))); let byeCount = nextPowerOfTwo - total;
            let teamIdx = 0; let matchCnt = 1;
            while (teamIdx < total) {
                if (byeCount > 0 && (total - teamIdx) <= byeCount) {
                    out.innerHTML += `<div class="match-row" style="opacity: 0.6; border-left-color: var(--text-muted);"><span>[${roundLabel} ${matchCnt++}경기]</span> <span>${tournamentTeams[teamIdx].name} &nbsp;<b>[부전승 ➔ 다음 라운드 진출]</b></span></div>`; teamIdx += 1; byeCount--;
                } else {
                    let teamA = tournamentTeams[teamIdx]; let teamB = tournamentTeams[teamIdx + 1];
                    if (teamA && teamB) { out.innerHTML += `<div class="match-row"><span>[${roundLabel} ${matchCnt++}경기]</span> <span>${teamA.name} (${teamA.side}) &nbsp;<b>VS</b>&nbsp; ${teamB.name} (${teamB.side})</span></div>`; }
                    teamIdx += 2;
                }
            }
            out.innerHTML += `<div class="match-row" style="margin-top:15px; border-color:#eab308; background: rgba(234, 179, 8, 0.05);"><span>[🏆 최종 결승전]</span> <strong>토너먼트 상위 승자전 최종 격돌</strong></div>`;
        }

        function saveToLocalStorage() { try { localStorage.setItem('custom_match_final_roster', JSON.stringify(players)); localStorage.setItem('custom_match_final_mode', document.getElementById('modeSelect').value); } catch(e) {} }
        window.onload = init;
    </script>
</body>
</html>
